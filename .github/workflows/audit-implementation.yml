name: Audit implementation

on:
  push:
    branches: [refactor/audit-2026-09-22]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-implementation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed, checksum-verified patch on the audit branch only
        id: source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/refactor/audit-2026-09-22
          if test -f .audit/patch.gz.b64; then
            python3 - <<'PY'
          import base64, gzip, hashlib, pathlib
          root = pathlib.Path('.audit')
          patch = gzip.decompress(base64.b64decode((root / 'patch.gz.b64').read_text(), validate=True))
          expected = (root / 'patch.sha256').read_text().strip()
          if hashlib.sha256(patch).hexdigest() != expected:
              raise SystemExit('Audit patch checksum mismatch')
          pathlib.Path('/tmp/audit.patch').write_bytes(patch)
          PY
            git apply --check /tmp/audit.patch
            git apply --index /tmp/audit.patch
            message=$(cat .audit/message.txt)
            git rm -- .audit/patch.gz.b64 .audit/patch.sha256 .audit/message.txt
            git diff --cached --check
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "$message"
            git push origin HEAD:refs/heads/refactor/audit-2026-09-22
          fi
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git bundle create /tmp/audit-repository.bundle --all
      - uses: actions/upload-artifact@v4
        with:
          name: audit-repository-${{ steps.source.outputs.commit }}
          path: /tmp/audit-repository.bundle
          retention-days: 3

  backend:
    needs: source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Backend tests
        working-directory: backend
        run: ./mvnw test
      - name: Full and core packages
        run: |
          (cd backend && ./mvnw clean package -DskipTests)
          bash scripts/ci/verify-admin-bundle.sh full
          (cd backend && ./mvnw clean package -Pbundle-core -Dmaven.test.skip=true)
          bash scripts/ci/verify-admin-bundle.sh core
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-backend-${{ needs.source.outputs.commit }}
          path: backend/**/target/surefire-reports/
          retention-days: 7

  frontend:
    needs: source
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm architecture:check && pnpm architecture:test
      - run: pnpm --filter @namewta/tooling-openapi openapi:check
      - run: pnpm lint && pnpm typecheck
      - run: pnpm test
      - run: pnpm build:dev && pnpm build:prod
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-frontend-${{ needs.source.outputs.commit }}
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7
