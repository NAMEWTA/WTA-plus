<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>系统更新中</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      color: #18212f;
      background: #f5f7f9;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background: #f5f7f9;
    }

    main {
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 32px 24px;
    }

    .message {
      width: min(100%, 560px);
      text-align: center;
    }

    .status-mark {
      display: inline-grid;
      width: 64px;
      height: 64px;
      margin-bottom: 28px;
      place-items: center;
      border: 1px solid #d8dee7;
      border-radius: 50%;
      background: #ffffff;
      color: #176b51;
      font-size: 30px;
      font-weight: 700;
      line-height: 1;
    }

    h1 {
      margin: 0;
      color: #18212f;
      font-size: 36px;
      font-weight: 650;
      letter-spacing: 0;
      line-height: 1.35;
    }

    p {
      margin: 16px 0 0;
      color: #5d6878;
      font-size: 18px;
      letter-spacing: 0;
      line-height: 1.7;
    }

    .divider {
      width: 48px;
      height: 3px;
      margin: 28px auto 0;
      border: 0;
      background: #176b51;
    }

    @media (max-width: 480px) {
      main {
        padding: 24px 20px;
      }

      h1 {
        font-size: 28px;
      }

      p {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <!-- @author wta；维护页不依赖外部资源，确保上游异常时仍可独立展示。 -->
  <main>
    <section class="message" aria-labelledby="maintenance-title">
      <div class="status-mark" aria-hidden="true">i</div>
      <h1 id="maintenance-title">系统正在更新中</h1>
      <p>敬请期待</p>
      <hr class="divider">
    </section>
  </main>
</body>
</html>
