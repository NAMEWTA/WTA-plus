x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "100m"
    max-file: "5"

x-admin-environment: &admin-environment
  TZ: Asia/Shanghai
  SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-prod}"
  SPRING_APPLICATION_NAME: namewta-admin
  SSO_WEB_ORIGIN: "${SSO_WEB_ORIGIN:?SSO_WEB_ORIGIN is required}"
  SSO_WEB_BASE_PATH: "${SSO_WEB_BASE_PATH:-/}"
  SSO_COOKIE_SECURE: "${SSO_COOKIE_SECURE:-true}"
  WEB_CORS_ALLOWED_ORIGINS: "${WEB_CORS_ALLOWED_ORIGINS:-}"
  TRUSTED_PROXY_CIDRS: "${TRUSTED_PROXY_CIDRS:-}"
  JAVA_OPTS: "${JAVA_OPTS:--Xms512m -Xmx1024m}"
  OPENAPI_ENABLED: "${OPENAPI_ENABLED:-false}"
  OPENAPI_KEK_VERSION: "${OPENAPI_KEK_VERSION:-}"
  OPENAPI_KEK: "${OPENAPI_KEK:-}"
  SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-wta-plus}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&autoReconnect=true&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true"
  SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_USERNAME: "${MYSQL_APP_USER:?MYSQL_APP_USER is required}"
  SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_PASSWORD: "${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD is required}"
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: 6379
  SPRING_DATA_REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
  OSS_READINESS_DIAGNOSTIC_OBJECTS_MINIO: "${MINIO_DIAGNOSTIC_OBJECT:-.well-known/oss-readiness/private-canary.txt}"
  SPRING_BOOT_ADMIN_CLIENT_ENABLED: "true"
  SPRING_BOOT_ADMIN_CLIENT_URL: http://namewta-monitor-admin:9090/admin
  SPRING_BOOT_ADMIN_CLIENT_USERNAME: "${MONITOR_USERNAME:?MONITOR_USERNAME is required}"
  SPRING_BOOT_ADMIN_CLIENT_PASSWORD: "${MONITOR_PASSWORD:?MONITOR_PASSWORD is required}"
  SNAIL_JOB_ENABLED: "${SNAIL_JOB_ENABLED:-false}"
  SNAIL_JOB_SERVER_HOST: namewta-snailjob-server
  SNAIL_JOB_SERVER_PORT: 17888
  SNAIL_AI_ENABLED: "${SNAIL_AI_ENABLED:-false}"
  SNAIL_AI_SERVER_HOST: namewta-snailai-server
  SNAIL_AI_SERVER_PORT: 18888

services:
  namewta-server1:
    image: "${NAMEWTA_ADMIN_IMAGE:-namewta/namewta-admin:6.0.0}"
    build:
      context: ./backend/images/wta-admin
    container_name: namewta-server1
    environment:
      <<: *admin-environment
      SERVER_PORT: 8080
      SNAIL_JOB_PORT: 28080
      SNAIL_AI_PORT: 38080
      LOG_PATH: /wta/server/logs
    ports:
      - "${NAMEWTA_BIND_HOST:-127.0.0.1}:48080:8080"
      - "${NAMEWTA_BIND_HOST:-127.0.0.1}:42080:28080"
      - "${NAMEWTA_BIND_HOST:-127.0.0.1}:43080:38080"
    volumes:
      - "${NAMEWTA_DATA_ROOT:-./runtime}/logs/server1:/wta/server/logs"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ': >/dev/tcp/127.0.0.1/8080'"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 60s
    logging: *default-logging
    restart: unless-stopped
    networks: [namewta]

  namewta-server2:
    image: "${NAMEWTA_ADMIN_IMAGE:-namewta/namewta-admin:6.0.0}"
    build:
      context: ./backend/images/wta-admin
    container_name: namewta-server2
    environment:
      <<: *admin-environment
      SERVER_PORT: 8080
      SNAIL_JOB_PORT: 28080
      SNAIL_AI_PORT: 38080
      LOG_PATH: /wta/server/logs
    ports:
      - "${NAMEWTA_BIND_HOST:-127.0.0.1}:48081:8080"
      - "${NAMEWTA_BIND_HOST:-127.0.0.1}:42081:28080"
      - "${NAMEWTA_BIND_HOST:-127.0.0.1}:43081:38080"
    volumes:
      - "${NAMEWTA_DATA_ROOT:-./runtime}/logs/server2:/wta/server/logs"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ': >/dev/tcp/127.0.0.1/8080'"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 60s
    logging: *default-logging
    restart: unless-stopped
    networks: [namewta]

  namewta-snailjob-server:
    image: "${NAMEWTA_SNAILJOB_IMAGE:-namewta/namewta-snailjob-server:6.0.0}"
    build:
      context: ./backend/images/wta-snailjob-server
    container_name: namewta-snailjob-server
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-prod}"
      SPRING_APPLICATION_NAME: namewta-snailjob-server
      JAVA_OPTS: "${JAVA_OPTS:--Xms512m -Xmx1024m}"
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-wta-plus}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: "${MYSQL_APP_USER:?MYSQL_APP_USER is required}"
      SPRING_DATASOURCE_PASSWORD: "${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD is required}"
      SPRING_BOOT_ADMIN_CLIENT_URL: http://namewta-monitor-admin:9090/admin
      SPRING_BOOT_ADMIN_CLIENT_USERNAME: "${MONITOR_USERNAME:?MONITOR_USERNAME is required}"
      SPRING_BOOT_ADMIN_CLIENT_PASSWORD: "${MONITOR_PASSWORD:?MONITOR_PASSWORD is required}"
    ports:
      - "${NAMEWTA_BIND_HOST:-127.0.0.1}:48800:8800"
      - "${NAMEWTA_BIND_HOST:-127.0.0.1}:47888:17888"
    volumes:
      - "${NAMEWTA_DATA_ROOT:-./runtime}/logs/snailjob:/wta/snailjob/logs"
    logging: *default-logging
    restart: unless-stopped
    networks: [namewta]

  namewta-snailai-server:
    image: "${NAMEWTA_SNAILAI_IMAGE:-namewta/namewta-snailai-server:6.0.0}"
    build:
      context: ./backend/images/wta-snailai-server
    container_name: namewta-snailai-server
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-prod}"
      SPRING_APPLICATION_NAME: namewta-snailai-server
      JAVA_OPTS: "${JAVA_OPTS:--Xms512m -Xmx1024m}"
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-wta-plus}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: "${MYSQL_APP_USER:?MYSQL_APP_USER is required}"
      SPRING_DATASOURCE_PASSWORD: "${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD is required}"
      SPRING_BOOT_ADMIN_CLIENT_URL: http://namewta-monitor-admin:9090/admin
      SPRING_BOOT_ADMIN_CLIENT_USERNAME: "${MONITOR_USERNAME:?MONITOR_USERNAME is required}"
      SPRING_BOOT_ADMIN_CLIENT_PASSWORD: "${MONITOR_PASSWORD:?MONITOR_PASSWORD is required}"
      SNAIL_AI_RAG_DOCLING_ENABLED: "${SNAIL_AI_RAG_DOCLING_ENABLED:-false}"
      SNAIL_AI_RAG_DOCLING_URL: "${SNAIL_AI_RAG_DOCLING_URL:-http://host.docker.internal:5100}"
      SNAIL_AI_RAG_DOCLING_PADDLE_OCR_ENABLED: "${SNAIL_AI_RAG_DOCLING_PADDLE_OCR_ENABLED:-false}"
      SNAIL_AI_RAG_DOCLING_PADDLE_OCR_URL: "${SNAIL_AI_RAG_DOCLING_PADDLE_OCR_URL:-http://host.docker.internal:8866/ocr}"
    ports:
      - "${NAMEWTA_BIND_HOST:-127.0.0.1}:48900:8900"
      - "${NAMEWTA_BIND_HOST:-127.0.0.1}:48888:18888"
    volumes:
      - "${NAMEWTA_DATA_ROOT:-./runtime}/logs/snailai:/wta/snailai/logs"
    extra_hosts:
      - host.docker.internal:host-gateway
    logging: *default-logging
    restart: unless-stopped
    networks: [namewta]

networks:
  namewta:
    external: true
    name: "${NAMEWTA_NETWORK:-namewta-network}"
