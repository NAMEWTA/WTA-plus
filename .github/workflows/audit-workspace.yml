name: Audit workspace snapshot

on:
  push:
    branches: [refactor/audit-foundation-20260923]
    paths: [.github/workflows/audit-workspace.yml]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Capture tracked source without local environment credentials
        run: |
          git archive HEAD -- . ':!backend/wta-admin/src/main/resources/application-local.yml' | gzip > /tmp/audit-source.tar.gz
          git rev-parse HEAD > /tmp/audit-source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: audit-source
          path: |
            /tmp/audit-source.tar.gz
            /tmp/audit-source-commit.txt
          retention-days: 1
