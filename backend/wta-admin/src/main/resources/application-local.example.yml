# Copy to application-local.yml for local use; neither file enters the JAR.
# Supply credentials through the process environment or the ignored local copy.
server:
  port: 38888

spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    dynamic:
      primary: master
      strict: true
      datasource:
        master:
          type: ${spring.datasource.type}
          driverClassName: com.mysql.cj.jdbc.Driver
          url: ${DB_URL}
          username: ${DB_USERNAME}
          password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD}
      timeout: 10s
  boot:
    admin:
      client:
        enabled: false

snail-job:
  enabled: false

# 浏览器仍走各 Vite App 的同源 API 代理；代理转发时保留的 Origin 仅许可这些本机入口。
# 使用其他主机名或端口时，通过 WEB_CORS_ALLOWED_ORIGINS 显式列出准确 Origin。
web:
  cors:
    allowed-origins: "${WEB_CORS_ALLOWED_ORIGINS:http://127.0.0.1:5177,http://127.0.0.1:5175,http://127.0.0.1:4176}"
